<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYNA WORKSHOP | Premium Model Works</title>
<meta name="description" content="Premium Gunpla and scale model assembly, painting, weathering, customization and model kit workshops.">
<style>
/* =========================================================
   CYNA WORKSHOP - CORE LAYOUT CONFIGURATIONS
   ========================================================= */
:root {
    --bg: #121212;
    --bg-soft: #191919;
    --bg-card: #1d1d1d;
    --orange: #ff6600;
    --orange-light: #ff8a3d;
    --text: #ffffff;
    --muted: #b7b7b7;
    --border: rgba(255, 102, 0, 0.35);
    --shadow: rgba(255, 102, 0, 0.20);
    --nav-height: 72px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    transition: background 0.3s ease;
}

img, video { max-width: 100%; display: block; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* =========================================================
   STAGING ACTION BAR & CONTROLS
   ========================================================= */
#publish-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #ff6600;
    color: #121212;
    z-index: 2000;
    padding: 10px 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255, 102, 0, 0.4);
}

#publish-bar button {
    background: #121212;
    color: #ffffff;
    border: none;
    padding: 6px 16px;
    border-radius: 4px;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: 0.2s;
}

#publish-bar button:hover { background: #242424; }

.admin-control-panel {
    background: rgba(255, 102, 0, 0.08);
    border: 1px dashed var(--orange);
    padding: 20px;
    border-radius: 8px;
    margin-top: 30px;
    display: none;
}

.admin-control-panel.active-editor-block { display: block; }

.admin-control-panel form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.admin-control-panel input, 
.admin-control-panel select {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 4px;
}

/* =========================================================
   NAVIGATION
   ========================================================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    z-index: 1000;
    background: rgba(12, 12, 12, 0.92);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
    transition: top 0.3s ease;
}

body.has-publish-bar { padding-top: 44px; }
body.has-publish-bar .navbar { top: 44px; }

.nav-container {
    width: min(1200px, 92%);
    height: 100%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; position: relative; }
.brand-text { font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
.brand-text span { color: var(--orange); }

.nav-links { display: flex; align-items: center; gap: 25px; }
.nav-links a { color: #ddd; font-size: 0.9rem; transition: 0.3s; }
.nav-links a:hover { color: var(--orange); text-shadow: 0 0 12px var(--shadow); }

.editor-toggle {
    border: 1px solid var(--orange);
    color: var(--orange);
    background: transparent;
    padding: 8px 14px;
    border-radius: 4px;
    transition: 0.3s;
    font-weight: 700;
    font-size: 0.85rem;
}

.editor-toggle:hover { background: var(--orange); color: #111; box-shadow: 0 0 20px var(--shadow); }

/* =========================================================
   HERO
   ========================================================= */
.hero {
    min-height: 100vh;
    padding: 140px 5% 90px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 80% 30%, rgba(255, 102, 0, 0.13), transparent 35%);
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.hero-content { width: min(1200px, 100%); margin: auto; position: relative; z-index: 1; }

.eyebrow {
    color: var(--orange);
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 18px;
}

.hero h1 {
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    line-height: 0.95;
    max-width: 850px;
    letter-spacing: -2px;
    margin-bottom: 30px;
}

.hero h1 span { color: var(--orange); }

.hero-description { max-width: 680px; color: var(--muted); font-size: 1.1rem; margin-bottom: 35px; }

.hero-actions { display: flex; flex-wrap: wrap; gap: 15px; }

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 22px;
    border: 1px solid var(--orange);
    border-radius: 4px;
    font-weight: 800;
    transition: 0.3s;
}

.btn-primary { background: var(--orange); color: #111; }
.btn-primary:hover { box-shadow: 0 0 30px var(--shadow); transform: translateY(-2px); }
.btn-outline { color: var(--orange); background: transparent; }
.btn-outline:hover { background: var(--orange); color: #111; box-shadow: 0 0 25px var(--shadow); }

/* =========================================================
   GENERAL SECTIONS
   ========================================================= */
section { padding: 100px 5%; border-bottom: 1px solid rgba(255, 255, 255, 0.02); }
.section-container { width: min(1200px, 100%); margin: auto; }
.section-header { margin-bottom: 45px; }
.section-label { color: var(--orange); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; font-size: 0.8rem; }
.section-title { font-size: clamp(2rem, 5vw, 3.5rem); margin-top: 8px; }
.section-description { color: var(--muted); max-width: 700px; margin-top: 12px; }

.reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.active { opacity: 1; transform: translateY(0); }

/* =========================================================
   SERVICES & TIER STYLING
   ========================================================= */
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }

.service-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 30px;
    border-radius: 6px;
    transition: 0.3s ease;
    position: relative;
}

.service-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px var(--shadow); border-color: var(--orange); }
.service-card h3 { font-size: 1.5rem; margin-bottom: 10px; }
.service-price { color: var(--orange); font-weight: 800; font-size: 1.25rem; margin-bottom: 20px; }
.service-features { list-style: none; color: var(--muted); font-size: 0.95rem; }
.service-features li { margin-bottom: 8px; position: relative; padding-left: 18px; }
.service-features li::before { content: "▪"; position: absolute; left: 0; color: var(--orange); }

/* =========================================================
   PORTFOLIO RESPONSIVE MULTI-MEDIA SLIDER GRID
   ========================================================= */
.portfolio-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }

.filter-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 18px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 700;
    transition: 0.2s;
}

.filter-btn.active, .filter-btn:hover { background: var(--orange); color: #121212; border-color: var(--orange); }

.portfolio-grid { columns: 3 280px; column-gap: 25px; }

.portfolio-item {
    break-inside: avoid;
    background: var(--bg-card);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    transition: 0.3s;
    margin-bottom: 25px;
    display: block;
}

.portfolio-item:hover { border-color: var(--border); }

.portfolio-slider-container { position: relative; background: #111; width: 100%; overflow: hidden; }
.portfolio-slides-wrapper { display: flex; width: 100%; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.portfolio-slide { flex: 0 0 100%; width: 100%; position: relative; }
.portfolio-slide img, .portfolio-slide video { width: 100%; height: auto; display: block; object-fit: contain; }

.slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(18, 18, 18, 0.7);
    border: 1px solid rgba(255, 102, 0, 0.4);
    color: var(--orange);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: bold;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
    user-select: none;
    cursor: pointer;
}

.portfolio-item:hover .slider-arrow { opacity: 1; }
.slider-arrow:hover { background: var(--orange); color: #121212; }
.arrow-left { left: 10px; }
.arrow-right { right: 10px; }

.slider-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
.slider-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); transition: 0.2s; cursor: pointer; }
.slider-dot.active { background: var(--orange); width: 16px; border-radius: 4px; }

.portfolio-details { padding: 20px; }
.portfolio-title { font-weight: 800; font-size: 1.1rem; }
.portfolio-category { color: var(--orange); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 700; }

.item-delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(18, 18, 18, 0.85);
    border: 1px solid #ff3b30;
    color: #ff3b30;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 800;
    z-index: 10;
    transition: 0.2s;
}

.item-delete-btn:hover { background: #ff3b30; color: #ffffff; }
</style>
</head>
<body class="has-publish-bar">

<div id="publish-bar">
    <span>CYNA WORKSHOP - EDITING MODE</span>
    <button id="save-btn">Save Changes</button>
</div>

<nav class="navbar">
    <div class="nav-container">
        <div class="brand">
            <div class="brand-text">CYNA <span>WORKSHOP</span></div>
        </div>
        <div class="nav-links">
            <a href="#portfolio">Portfolio</a>
            <button class="editor-toggle" id="toggle-editor">+ Add Work</button>
        </div>
    </div>
</nav>

<main>
    <section class="hero">
        <div class="hero-content">
            <div class="eyebrow">Master Class Customs</div>
            <h1>PRECISION <span>GUNPLA</span> &amp; SCALE WORKS</h1>
            <p class="hero-description">Professional customization, airbrushing, weathering, and scratch-building studio.</p>
            <div class="hero-actions">
                <a href="#portfolio" class="btn btn-primary">View Gallery</a>
            </div>
        </div>
    </section>

    <section id="portfolio">
        <div class="section-container">
            <div class="section-header">
                <div class="section-label">Selected Works</div>
                <h2 class="section-title">PORTFOLIO GALLERY</h2>
            </div>

            <div class="admin-control-panel" id="admin-panel">
                <form id="upload-form">
                    <label>Project Title:</label>
                    <input type="text" id="work-title" placeholder="e.g. PG Unleashed RX-78-2 Custom" required>
                    
                    <label>Category:</label>
                    <select id="work-category">
                        <option value="Gunpla">Gunpla</option>
                        <option value="Scale Work">Scale Work</option>
                        <option value="Custom Paint">Custom Paint</option>
                    </select>

                    <label>Upload Media (Images/Videos):</label>
                    <input type="file" id="work-files" accept="image/*,video/*" multiple required>

                    <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Add To Gallery</button>
                </form>
            </div>

            <div class="portfolio-grid" id="portfolio-container">
                </div>
        </div>
    </section>
</main>

<script>
// =========================================================
// LOCALSTORAGE & SLIDER ENGINE
// =========================================================
const STORAGE_KEY = 'cyna_portfolio_items';

// Initial default items if storage is empty
const defaultData = [
    {
        id: "1",
        title: "PG Unleashed RX-78-2",
        category: "Gunpla",
        media: [
            { type: "image", src: "https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=800&q=80" }
        ]
    },
    {
        id: "2",
        title: "Sazabi Ver.Ka Weathering",
        category: "Custom Paint",
        media: [
            { type: "image", src: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80" }
        ]
    }
];

function getStoredItems() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : defaultData;
}

function saveItemsToStorage(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function renderPortfolio() {
    const container = document.getElementById('portfolio-container');
    const items = getStoredItems();
    container.innerHTML = '';

    items.forEach((item) => {
        const itemCard = document.createElement('div');
        itemCard.className = 'portfolio-item';
        itemCard.dataset.id = item.id;

        let slidesHTML = '';
        let dotsHTML = '';
        const showControls = item.media.length > 1;

        item.media.forEach((m, idx) => {
            const activeClass = idx === 0 ? 'active' : '';
            if (m.type.startsWith('video')) {
                slidesHTML += `<div class="portfolio-slide"><video src="${m.src}" controls></video></div>`;
            } else {
                slidesHTML += `<div class="portfolio-slide"><img src="${m.src}" alt="${item.title}"></div>`;
            }
            if (showControls) {
                dotsHTML += `<div class="slider-dot ${activeClass}" data-slide="${idx}"></div>`;
            }
        });

        itemCard.innerHTML = `
            <button class="item-delete-btn" onclick="deleteItem('${item.id}')">Delete</button>
            <div class="portfolio-slider-container">
                <div class="portfolio-slides-wrapper" style="transform: translateX(0%);">
                    ${slidesHTML}
                </div>
                ${showControls ? `
                    <div class="slider-arrow arrow-left" onclick="moveSlide('${item.id}', -1)">&#10094;</div>
                    <div class="slider-arrow arrow-right" onclick="moveSlide('${item.id}', 1)">&#10095;</div>
                    <div class="slider-dots">${dotsHTML}</div>
                ` : ''}
            </div>
            <div class="portfolio-details">
                <div class="portfolio-title">${item.title}</div>
                <div class="portfolio-category">${item.category}</div>
            </div>
        `;

        container.appendChild(itemCard);
    });
}

function moveSlide(itemId, direction) {
    const card = document.querySelector(`.portfolio-item[data-id="${itemId}"]`);
    const wrapper = card.querySelector('.portfolio-slides-wrapper');
    const slides = card.querySelectorAll('.portfolio-slide');
    const dots = card.querySelectorAll('.slider-dot');
    
    let currentIndex = parseInt(card.dataset.currentIndex || "0");
    currentIndex = (currentIndex + direction + slides.length) % slides.length;
    card.dataset.currentIndex = currentIndex;

    wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;

    dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
    });
}

function deleteItem(id) {
    let items = getStoredItems();
    items = items.filter(item => item.id !== id);
    saveItemsToStorage(items);
    renderPortfolio();
}

// Toggle Add Form Panel
document.getElementById('toggle-editor').addEventListener('click', () => {
    document.getElementById('admin-panel').classList.toggle('active-editor-block');
});

// Save Button Event
document.getElementById('save-btn').addEventListener('click', () => {
    alert('Portfolio state successfully saved to localStorage!');
});

// Process File Uploads and Save
document.getElementById('upload-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const title = document.getElementById('work-title').value;
    const category = document.getElementById('work-category').value;
    const fileList = Array.from(document.getElementById('work-files').files);

    const mediaList = await Promise.all(fileList.map(file => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                resolve({
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    src: evt.target.result
                });
            };
            reader.readAsDataURL(file);
        });
    }));

    const newItem = {
        id: Date.now().toString(),
        title,
        category,
        media: mediaList
    };

    const currentItems = getStoredItems();
    currentItems.unshift(newItem);
    saveItemsToStorage(currentItems);
    renderPortfolio();

    document.getElementById('upload-form').reset();
    document.getElementById('admin-panel').classList.remove('active-editor-block');
});

// Initialize on Load
document.addEventListener('DOMContentLoaded', renderPortfolio);
</script>
</body>
</html>
