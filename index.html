<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYNA WORKSHOP | Premium Model Works</title>
    <meta name="description" content="Premium Gunpla and scale model assembly, painting, weathering, customization and model kit workshops.">
    <style>
        /* =========================================================
           CYNA WORKSHOP - CORE LAYOUT CONFIGURATIONS
           ========================================================= */
        :root {
            --bg: #121212;
            --bg-soft: #191919;
            --bg-card: #1d1d1d;
            --orange: #ff6600;
            --orange-light: #ff8a3d;
            --text: #ffffff;
            --muted: #b7b7b7;
            --border: rgba(255, 102, 0, 0.35);
            --shadow: rgba(255, 102, 0, 0.20);
            --nav-height: 72px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        img, video {
            max-width: 100%;
            display: block;
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           STAGING ACTION BAR & CONTROLS
           ========================================================= */
        #publish-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #ff6600;
            color: #121212;
            z-index: 2000;
            padding: 10px 20px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(255, 102, 0, 0.4);
        }

        #publish-bar button {
            background: #121212;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        #publish-bar button:hover {
            background: #242424;
        }

        .admin-control-panel {
            background: rgba(255, 102, 0, 0.08);
            border: 1px dashed var(--orange);
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            display: none;
        }

        .admin-control-panel.active-editor-block {
            display: block;
        }

        /* =========================================================
           NAVIGATION
           ========================================================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(12, 12, 12, 0.92);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            transition: top 0.3s ease;
        }

        body.has-publish-bar .navbar {
            top: 44px;
        }

        .nav-container {
            width: min(1200px, 92%);
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            position: relative;
        }

        .brand-text {
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .brand-text span {
            color: var(--orange);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #ddd;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--orange);
            text-shadow: 0 0 12px var(--shadow);
        }

        .editor-toggle {
            border: 1px solid var(--orange);
            color: var(--orange);
            background: transparent;
            padding: 8px 14px;
            border-radius: 4px;
            transition: 0.3s;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .editor-toggle:hover {
            background: var(--orange);
            color: #111;
            box-shadow: 0 0 20px var(--shadow);
        }

        /* =========================================================
           HERO
           ========================================================= */
        .hero {
            min-height: 100vh;
            padding: 140px 5% 90px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 80% 30%, rgba(255, 102, 0, 0.13), transparent 35%);
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .hero-content {
            width: min(1200px, 100%);
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            color: var(--orange);
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            line-height: 0.95;
            max-width: 850px;
            letter-spacing: -2px;
            margin-bottom: 30px;
        }

        .hero h1 span {
            color: var(--orange);
        }

        .hero-description {
            max-width: 680px;
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 22px;
            border: 1px solid var(--orange);
            border-radius: 4px;
            font-weight: 800;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--orange);
            color: #111;
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px var(--shadow);
            transform: translateY(-2px);
        }

        .btn-outline {
            color: var(--orange);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--orange);
            color: #111;
            box-shadow: 0 0 25px var(--shadow);
        }

        /* =========================================================
           GENERAL SECTIONS
           ========================================================= */
        section {
            padding: 100px 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .section-container {
            width: min(1200px, 100%);
            margin: auto;
        }

        .section-header {
            margin-bottom: 45px;
        }

        .section-label {
            color: var(--orange);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 800;
            font-size: 0.8rem;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-top: 8px;
        }

        .section-description {
            color: var(--muted);
            max-width: 700px;
            margin-top: 12px;
        }

        /* Scroll Animation States */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================================
           SERVICES & TIER STYLING
           ========================================================= */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 6px;
            transition: 0.3s ease;
            position: relative;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow);
            border-color: var(--orange);
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .service-price {
            color: var(--orange);
            font-weight: 800;
            font-size: 1.25rem;
            margin-bottom: 20px;
        }

        .service-features {
            list-style: none;
            color: var(--muted);
